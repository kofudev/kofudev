<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
  <title id="t">Kofu — Développeur web, applications et outils</title>
  <desc id="d">Bannière sombre bleu nuit, titre KOFU, motif abstrait en forme de V et détails bleu glacier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c20"/>
      <stop offset="0.58" stop-color="#050818"/>
      <stop offset="1" stop-color="#0e1c32"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#64c5ff" stop-opacity=".19"/>
      <stop offset="1" stop-color="#64c5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset=".44" stop-color="#BFE6FF"/>
      <stop offset="1" stop-color="#65a9e8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0ebff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#a0beff" stop-opacity=".015"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".75" fill="#BFE6FF" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1200" height="350" rx="18" fill="url(#bg)"/>
  <ellipse cx="1000" cy="135" rx="315" ry="255" fill="url(#halo)"/>
  <rect x="650" y="20" width="510" height="310" fill="url(#dots)"/>
  <path d="M0 298H1200" stroke="#bfe6ff" stroke-opacity=".09"/>
  <path d="M40 0V350M1160 0V350" stroke="#bfe6ff" stroke-opacity=".06"/>
  <rect x="1" y="1" width="1198" height="348" rx="17" fill="none" stroke="#bfe6ff" stroke-opacity=".15" stroke-width="1.5"/>

  <circle cx="74" cy="52" r="4" fill="#bfe6ff"/>
  <text x="90" y="57" fill="#b2c4d7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="3.4">INDEPENDENT DEVELOPER</text>

  <text x="68" y="190" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="107" font-weight="700" letter-spacing="-5">KOFU</text>
  <rect x="72" y="210" width="45" height="4" rx="2" fill="#bfe6ff"/>
  <text x="72" y="256" fill="#e0ebf7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing=".1">Du concept au produit.</text>
  <text x="72" y="282" fill="#9eafc5" font-family="Arial, Helvetica, sans-serif" font-size="15">Web · Logiciels · Outils · Discord</text>
  <text x="72" y="323" fill="#70849e" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.4">GITHUB.COM/KOFUDEV</text>

  <g transform="translate(819 31)">
    <rect x="0" y="0" width="300" height="286" rx="28" fill="url(#panel)" stroke="#bfe6ff" stroke-opacity=".19"/>
    <rect x="18" y="18" width="264" height="250" rx="19" fill="none" stroke="#bfe6ff" stroke-opacity=".055"/>
    <path d="M57 73L150 232L242 73" fill="none" stroke="#65b3eb" stroke-opacity=".28" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M56 76L149 226" fill="none" stroke="url(#line)" stroke-width="28" stroke-linecap="round"/>
    <path d="M242 76L149 226" fill="none" stroke="url(#line)" stroke-width="28" stroke-linecap="round" opacity=".92"/>
    <path d="M56 76L149 226" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5" stroke-linecap="round" transform="translate(-6 -4)"/>
    <circle cx="56" cy="76" r="6" fill="#fff" fill-opacity=".65"/>
    <circle cx="242" cy="76" r="6" fill="#bfe6ff"/>
    <circle cx="149" cy="226" r="5" fill="#c5eaff"/>
    <path d="M30 38h36M234 244h34" stroke="#bfe6ff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
