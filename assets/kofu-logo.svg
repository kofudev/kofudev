      <stop offset=".25" stop-color="#02dbff"/>
      <stop offset=".67" stop-color="#bffaff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g opacity=".42" filter="url(#shadow)" transform="translate(2,10)">
    <path fill="#0f75ee" d="M170 74H246L217 215 365 74H433L257 246 377 421H296L207 291 182 421H107Z"/>
