<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kofu K monogram">
  <defs>
    <linearGradient id="ice" x1=".18" x2=".8" y1="0" y2="1">
      <stop offset="0" stop-color="#f3faff"/>
      <stop offset=".2" stop-color="#a7faff"/>
      <stop offset=".46" stop-color="#06dfff"/>
      <stop offset=".78" stop-color="#0a68eb"/>
      <stop offset="1" stop-color="#113ca4"/>
    </linearGradient>
    <linearGradient id="upper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#88f9ff"/>
      <stop offset=".68" stop-color="#02d9f5"/><stop offset="1" stop-color="#1672e8"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" x2=".82" y1="0" y2="1">
      <stop offset="0" stop-color="#f9ffff"/><stop offset=".38" stop-color="#88e8ff"/><stop offset="1" stop-color="#0963ca"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="0">
